# dkms.conf - ramsleuth_intel DKMS module configuration for RamSleuth v2.
#
# MAKE passes KVER=${kernelver}: the staged Makefile resolves KDIR to
# /lib/modules/$(KVER)/build, so DKMS builds against the selected
# kernel's headers (the AMD pattern from packaging/ryzen-smu-dkms).
#
# PACKAGE_VERSION keeps the @VERSION@ placeholder form: the install
# helper (scripts/install-intel-dkms.sh, INTEL-06) seds it to the
# ramsleuth workspace version before `dkms add` (AMD pattern).
#
# DEST_MODULE_LOCATION stays "/extra": the helper writes the depmod
# override `override ramsleuth_intel /extra/ramsleuth_intel.ko`, so the
# module must install to /extra for modprobe to resolve it.
#
# Purpose: build and install the optional `ramsleuth_intel` out-of-tree
# kernel module, which exposes the raw Intel IMC registers at
# /sys/kernel/ramsleuth_intel/ for RamSleuth.
#
# NOT a hard dependency: RamSleuth degrades gracefully without it (the
# Intel section reads N/A (DriverMissing), exit 0, no panic; the
# /dev/mem fallback path remains available where unblocked). It is an
# optional recommended extra.
#
# AUTOINSTALL=yes: DKMS auto-rebuilds and reinstalls the module on
# every kernel update (pacman-managed) - no manual rebuild step.
#
# Prerequisite: the matching kernel headers (pacman-managed) must be
# installed before `dkms build` (e.g. the linux package on Arch-class
# distros, which ships /lib/modules/<ver>/build).
#
# Note: this file is SOURCED by DKMS - KEY="value" lines only, no
# shell-executable content.

PACKAGE_NAME="ramsleuth_intel"
PACKAGE_VERSION="@VERSION@"
BUILT_MODULE_NAME[0]="ramsleuth_intel"
DEST_MODULE_LOCATION[0]="/extra"
AUTOINSTALL="yes"
MAKE="make KVER=${kernelver}"
MODULE_STRIP[0]=""
