name: Release

# Tag-triggered release workflow (C19-03).
#
# When a version tag (e.g. v2.1.0) is pushed, this builds the workspace
# release, packages the installable artifacts into a deterministic tarball
# + sha256, and publishes them as a GitHub Release. This is the public
# download source for the ramsleuth-bin AUR package (C19-05) and the single
# release artifact that the unified versioning flows through.
#
# Release-artifact contract (C19-05 consumes exactly this):
#   - Primary artifact:  ramsleuth-<ver>-x86_64.tar.zst
#   - Companion checksum: ramsleuth-<ver>-x86_64.tar.zst.sha256 (sha256sum format)
#   - <ver> = the tag with the leading 'v' stripped (v2.1.0 -> 2.1.0)
#   - Internal layout (top-level ramsleuth-<ver>/), mirroring the AUR install:
#       bin/ramsleuth, bin/ramsleuth-tui, bin/ramsleuth-client,
#       bin/ramsleuth-daemon, bin/ramsleuth-bench, bin/ramsleuth-telemetry,
#       systemd/ramsleuth.service, systemd/ramsleuth.preset,
#       scripts/install-ryzen-smu-dkms.sh, scripts/install-intel-dkms.sh,
#       kernel/ramsleuth-intel/ (the 4 module source files; the Intel DKMS
#       one-click path, INTEL-14),
#       install.sh, LICENSE, RamSleuth.desktop,
#       ramsleuth-setup.sh, 90-ramsleuth-setup.policy,
#       assets/icons/ (the hicolor tree, 8 sizes — one artifact; C21-27)
#
# NOTE: this is a SEPARATE workflow from .github/workflows/ci.yml (which is
# untouched). Determinism: fixed file order (tar --sort=name), fixed
# ownership (--owner=0 --group=0 --numeric-owner), fixed mtime (--mtime=@0).
on:
  push:
    tags: ['v[0-9]*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release, e.g. 2.1.0 (manual runs only; tag pushes use the tag)'
        required: false
        default: ''

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Derive version
        run: |
          set -euo pipefail
          if [ -n "${INPUT_VERSION:-}" ]; then
            # Manual run: explicit version input (no leading 'v')
            VER="$INPUT_VERSION"
          elif [ "${GITHUB_REF#refs/tags/v}" != "$GITHUB_REF" ]; then
            # Tag push: strip the 'refs/tags/v' prefix (v2.1.0 -> 2.1.0)
            VER="${GITHUB_REF#refs/tags/v}"
          else
            echo "::error::No version: not a tag push and no 'version' input provided"
            exit 1
          fi
          case "$VER" in
            [0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "::error::Invalid version '$VER' (expected MAJOR.MINOR.PATCH)"
               exit 1 ;;
          esac
          echo "VER=$VER" >> "$GITHUB_ENV"
          echo "Releasing RamSleuth $VER"

      - name: Install GUI system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libwayland-dev libx11-dev \
            libxrandr-dev libxi-dev libxcursor-dev libxinerama-dev \
            libgl1-mesa-dev pkgconf

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@v2

      - name: Build (release, locked)
        run: cargo build --release --workspace --locked

      - name: Verify release artifacts
        run: |
          set -uo pipefail
          missing=0
          for f in \
            target/release/ramsleuth \
            target/release/ramsleuth-tui \
            target/release/ramsleuth-client \
            target/release/ramsleuth-daemon \
            target/release/ramsleuth-bench \
            target/release/ramsleuth-telemetry \
            systemd/ramsleuth.service \
            packaging/shared/ramsleuth.preset \
            packaging/shared/RamSleuth.desktop \
            scripts/install-ryzen-smu-dkms.sh \
            scripts/install-intel-dkms.sh \
            kernel/ramsleuth-intel/dkms.conf \
            kernel/ramsleuth-intel/Makefile \
            kernel/ramsleuth-intel/ramsleuth_intel.c \
            kernel/ramsleuth-intel/README.md \
            install.sh \
            LICENSE \
            scripts/ramsleuth-setup.sh \
            packaging/polkit/90-ramsleuth-setup.policy
          do
            if [ ! -f "$f" ]; then
              echo "::error::Missing release artifact: $f"
              missing=1
            fi
          done
          if [ ! -d "assets/icons" ]; then
            echo "::error::Missing release artifact: assets/icons"
            missing=1
          fi
          [ "$missing" -eq 0 ] || { echo "Refusing to publish: release artifacts missing"; exit 1; }
          echo "All 19 release artifacts present (6 binaries + 13 auxiliary)"
          # NOTE (C21-27 / INTEL-14): the assets/icons hicolor tree is
          # staged into the tarball by the Stage step below; the
          # release-artifact count is 19 (6 binaries + 13 auxiliary: the 8
          # pre-Intel auxiliary files + the Intel DKMS helper + the 4
          # kernel/ramsleuth-intel module source files; the hicolor tree
          # ships as a bundle).

      - name: Stage artifacts
        run: |
          set -euo pipefail
          S="stage/ramsleuth-$VER"
          mkdir -p "$S/bin" "$S/systemd" "$S/scripts" "$S/kernel/ramsleuth-intel"
          for b in ramsleuth ramsleuth-tui ramsleuth-client ramsleuth-daemon ramsleuth-bench ramsleuth-telemetry; do
            cp "target/release/$b" "$S/bin/$b"
          done
          cp systemd/ramsleuth.service "$S/systemd/"
          cp packaging/shared/ramsleuth.preset "$S/systemd/"
          cp scripts/install-ryzen-smu-dkms.sh "$S/scripts/"
          cp scripts/install-intel-dkms.sh "$S/scripts/"
          cp install.sh "$S/"
          cp LICENSE "$S/"
          cp packaging/shared/RamSleuth.desktop "$S/"
          cp -r assets/icons "$S/"
          cp scripts/ramsleuth-setup.sh "$S/"
          cp packaging/polkit/90-ramsleuth-setup.policy "$S/"
          for f in dkms.conf Makefile ramsleuth_intel.c README.md; do
            cp "kernel/ramsleuth-intel/$f" "$S/kernel/ramsleuth-intel/"
          done
          chmod +x "$S/bin/"* "$S/scripts/"*.sh "$S/install.sh" "$S/ramsleuth-setup.sh"
          find stage -type f | sort

      - name: Create deterministic tarball
        run: |
          set -euo pipefail
          command -v zstd >/dev/null 2>&1 || { echo "::error::zstd is required for the .tar.zst contract artifact"; exit 1; }
          tar --sort=name --owner=0 --group=0 --numeric-owner --mtime='@0' \
            -cf - -C stage "ramsleuth-$VER" | zstd -q -T0 -o "ramsleuth-$VER-x86_64.tar.zst"
          ls -l "ramsleuth-$VER-x86_64.tar.zst"

      - name: Create sha256 checksum
        run: |
          set -euo pipefail
          sha256sum "ramsleuth-$VER-x86_64.tar.zst" > "ramsleuth-$VER-x86_64.tar.zst.sha256"
          cat "ramsleuth-$VER-x86_64.tar.zst.sha256"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VER }}
          files: |
            ramsleuth-${{ env.VER }}-x86_64.tar.zst
            ramsleuth-${{ env.VER }}-x86_64.tar.zst.sha256
          fail_on_duplicate: false
