name: CI

on:
  push:
    branches: [v2-development]
  pull_request:
    branches: [v2-development]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        toolchain: ["1.75", "stable"]
    steps:
      - uses: actions/checkout@v4

      - name: Install GUI system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libwayland-dev libx11-dev \
            libxrandr-dev libxi-dev libxcursor-dev libxinerama-dev \
            libgl1-mesa-dev pkgconf

      - name: Install Rust ${{ matrix.toolchain }}
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain }}
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - name: Test (debug)
        run: cargo test --workspace

      - name: Test (release)
        run: cargo test --workspace --release

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install GUI system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libwayland-dev libx11-dev \
            libxrandr-dev libxi-dev libxcursor-dev libxinerama-dev \
            libgl1-mesa-dev pkgconf

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@v2

      - name: Build (release)
        run: cargo build --release --workspace

      - name: Upload release binaries
        uses: actions/upload-artifact@v4
        with:
          name: ramsleuth-release-binaries
          path: |
            target/release/ramsleuth-daemon
            target/release/ramsleuth-client
            target/release/ramsleuth-tui
            target/release/ramsleuth
            target/release/ramsleuth-bench
            target/release/ramsleuth-telemetry

  kernel-module:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install kernel build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential linux-headers-generic

      - name: Build ramsleuth_intel (fail on any warning)
        run: |
          set -euo pipefail
          KVER=$(ls -d /lib/modules/*-generic | sort -V | tail -1 | xargs -n1 basename)
          echo "Building ramsleuth_intel against kernel ${KVER}"
          cd kernel/ramsleuth-intel
          make KVER="${KVER}" 2>&1 | tee build.log
          test -f ramsleuth_intel.ko
          echo "Checking for compiler warnings in build.log..."
          test -z "$(grep -E 'warning:' build.log)"
          echo "OK: ramsleuth_intel.ko built with zero compiler warnings"
