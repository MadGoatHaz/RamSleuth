[package]
name = "ramsleuth-telemetry"
description = "Hardware telemetry: ryzen_smu (AMD), MCHBAR MMIO (Intel), ee1004 SPD parsers"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
# P2-03: the single new Phase 2 dependency (plan D6 / dependency ledger):
# `nix` for the ryzen_smu char-device fallback. Feature names below are the
# *actual* nix 0.29 names for the brief's ["mmap", "ioctl", "err"] set:
#   "mmap" -> "mman"   (nix::sys::mmap for P2-06's /dev/mem read-only map)
#   "err"  -> always-on nix::errno module (no feature exists)
# plus "fs" (OFlag / fcntl::open for the char-device read) and "ioctl"
# (D6; the driver's companion RSMU_IOC_GET_VERSION). All features are
# added up front so P2-06 need not touch this manifest again.
nix = { version = "0.29", features = ["fs", "ioctl", "mman"] }
# P3-01: serde for the wire-contract types `NaReason` + `Section<T>`
# (plan D2/D7, dependency ledger: the telemetry `serde` entry is owned
# by P3-01). The `derive` feature backs `#[derive(serde::Serialize,
# serde::Deserialize)]` in src/error.rs. `TelemetryError` deliberately
# gets no serde: its `Io` arm holds a non-serializable
# `std::io::Error` and never crosses the wire (plan D2).
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
# P3-01: test-only bincode round-trips of `NaReason` / `Section<T>`
# (plan D3: bincode 1.3 is the wire codec format; the runtime
# dependency on it stays owned by ramsleuth-protocol, P3-10).
bincode = "1.3"
