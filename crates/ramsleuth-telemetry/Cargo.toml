[package]
name = "ramsleuth-telemetry"
description = "Hardware telemetry: ryzen_smu (AMD), MCHBAR MMIO (Intel), ee1004 SPD parsers"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
# P2-03: the single new Phase 2 dependency (plan D6 / dependency ledger):
# `nix` for the ryzen_smu char-device fallback. Feature names below are the
# *actual* nix 0.29 names for the brief's ["mmap", "ioctl", "err"] set:
#   "mmap" -> "mman"   (nix::sys::mmap for P2-06's /dev/mem read-only map)
#   "err"  -> always-on nix::errno module (no feature exists)
# plus "fs" (OFlag / fcntl::open for the char-device read) and "ioctl"
# (D6; the driver's companion RSMU_IOC_GET_VERSION). All features are
# added up front so P2-06 need not touch this manifest again.
nix = { version = "0.29", features = ["fs", "ioctl", "mman"] }
