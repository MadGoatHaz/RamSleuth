# dkms.conf — ryzen_smu DKMS module configuration for RamSleuth v2.
#
# MAKE mirrors the authoritative upstream amkillam/ryzen_smu dkms.conf
# (proven in the working AUR ryzen_smu-dkms-git package): DKMS runs it
# inside the staged build dir (/usr/src/ryzen_smu-<ver>/build), where the
# staged upstream Makefile resolves the kernel build tree itself (KDIR :=
# /lib/modules/$(TARGET)/build on Arch; /usr/src/linux-headers-* absent) and
# passes M=$(CURDIR). TARGET=${kernelver} pins the build to the kernel DKMS
# selected (upstream's Makefile otherwise defaults to `uname -r`).
#
# P5-12 fix: the P5-03 version used
#   MAKE="make -C ${kernel_source_dir} M=${dkms_tree}/${PACKAGE_NAME}/${PACKAGE_VERSION} modules"
# whose M= pointed at the version root while DKMS builds in .../build and
# looks for the built .ko there -> `dkms build` failed (the /build path was
# omitted). The Makefile-driven pattern above places both the build and the
# resulting .ko in DKMS's build dir, as DKMS expects.
#
# Upstream's `CFLAGS_MODULE+=@CFLGS@` extension hook is deliberately omitted:
# it only works if a sed step substitutes @CFLGS@ (upstream's own
# `make dkms-install` does; our install-ryzen-smu-dkms.sh does not), so a
# literal @CFLGS@ would break the compile. PACKAGE_VERSION keeps the upstream
# placeholder form; the install script's whole-line sed aligns it to the
# staged $PKGVER.
#
# DEST_MODULE_LOCATION stays "/extra" (upstream uses
# "/kernel/drivers/ryzen_smu"): the P5-11 install script writes the depmod
# override `override ryzen_smu /extra/ryzen_smu.ko`, so the module must
# install to /extra for modprobe to resolve it.
#
# Purpose: build and install the optional `ryzen_smu` out-of-tree AMD kernel
# module, which exposes live AMD SMU sub-timings at
# /sys/kernel/ryzen_smu_drv/pm_table for RamSleuth.
#
# NOT a hard dependency: RamSleuth degrades gracefully without it
# (N/A (DriverMissing), exit 0, no panic). It is an optional recommended
# extra.
#
# AUTOINSTALL=yes: DKMS auto-rebuilds and reinstalls the module on every
# kernel update (pacman-managed) — no manual rebuild step.
#
# Prerequisite: the matching kernel headers (pacman-managed) must be
# installed before `dkms build` (e.g. the linux-headers package or the
# custom-kernel header package on this host).
#
# Note: this file is SOURCED by DKMS — KEY="value" lines only, no
# shell-executable content.

PACKAGE_NAME="ryzen_smu"
PACKAGE_VERSION="@VERSION@"
BUILT_MODULE_NAME[0]="ryzen_smu"
DEST_MODULE_LOCATION[0]="/extra"
AUTOINSTALL="yes"
MAKE="make TARGET=${kernelver}"
MODULE_STRIP[0]=""
